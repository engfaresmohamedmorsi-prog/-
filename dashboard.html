<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#334d3c">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <title>جوة الحكاية | لوحة الرسائل</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main class="page-shell dashboard-shell">
    <header class="site-header">
      <a class="brand" href="/">جوة الحكاية <span lang="en" dir="ltr">Gowa_El_Hekaya</span></a>
      <nav class="site-nav" aria-label="التنقل">
        <a class="quiet-link" href="/">صندوق الرسائل</a>
        <a class="quiet-link" href="/self-check">التأمل الذاتي</a>
        <a class="quiet-link" href="https://www.tiktok.com/@gowa_el_hekaya" target="_blank" rel="noopener noreferrer">تيك توك</a>
      </nav>
    </header>

    <section class="dashboard-card" aria-labelledby="dashboard-title">
      <div class="dashboard-heading">
        <div>
          <div class="eyebrow">مساحة خاصة</div>
          <h1 id="dashboard-title">صندوق الرسائل</h1>
        </div>
        <button id="logout-button" class="secondary-button hidden" type="button">تسجيل الخروج</button>
      </div>

      <form id="login-form" class="login-form">
        <p class="intro">أدخل كلمة مرور الإدارة لعرض الرسائل.</p>
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="primary-button" type="submit">دخول</button>
      </form>

      <p id="dashboard-status" class="form-status" role="status" aria-live="polite"></p>
      <section id="inbox" class="inbox hidden" aria-label="الرسائل الواردة">
        <div class="inbox-toolbar">
          <p id="message-count" class="message-count"></p>
          <div class="inbox-actions">
            <button id="notification-button" class="secondary-button" type="button">تفعيل إشعارات الخلفية</button>
            <button id="refresh-button" class="secondary-button" type="button">تحديث</button>
          </div>
        </div>
        <label class="archive-search-label" for="archive-search">البحث في الأرشيف</label>
        <input id="archive-search" class="archive-search" type="search" placeholder="ابحث في نص الرسائل...">
        <p id="notification-status" class="notification-status" role="status" aria-live="polite"></p>
        <div id="message-list" class="message-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
